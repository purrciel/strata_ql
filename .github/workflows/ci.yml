name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.15.8"
            otp: "26.2"
          - elixir: "1.18.3"
            otp: "27.3"

    env:
      MIX_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Elixir
        uses: erlef/setup-beam@e6d7c94229049569db56a7ad5a540c051a010af9 # v1.20.4
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps and build
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

      - name: Run the server-backed load test
        if: matrix.otp == '27.3'
        env:
          SURREALDB_URL: ws://127.0.0.1:8000/rpc
          SURREALDB_USER: root
          SURREALDB_PASS: root
          SURREALDB_NS: bench
          SURREALDB_DB: bench
        run: |
          docker run -d --name surreal -p 127.0.0.1:8000:8000 surrealdb/surrealdb:v4.0.1 start --bind 0.0.0.0:8000 --user root --pass root memory
          curl --retry 30 --retry-connrefused --retry-all-errors --retry-delay 1 -fsS http://127.0.0.1:8000/health
          curl -fsS -u root:root -H 'Surreal-NS: bench' -H 'Surreal-DB: bench' -H 'Accept: application/json' --data 'DEFINE NAMESPACE bench; DEFINE DATABASE bench;' http://127.0.0.1:8000/sql | jq -e 'all(.[]; .status == "OK")'
          mix run bench/query_load.exs
